<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unexpected Dynamics | Autonomous Industrial Inspection Robotics</title>
  <meta name="description" content="Autonomous quadruped inspection robots engineered for extreme terrains: 220kV-765kV power substations, oil refineries, and heavy industry." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* CSS Tokens & Theming */
    :root {
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      /* Dark Theme (Default) */
      --bg-base: #080b11;
      --bg-surface: #0f1422;
      --bg-card: #141c2e;
      --bg-card-hover: #1a253c;
      --border-subtle: #202b42;
      --border-active: #3b4d75;
      
      --text-main: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      --hazard-yellow: #f59e0b;
      --hazard-yellow-hover: #d97706;
      --hazard-yellow-glow: rgba(245, 158, 11, 0.25);
      
      --electric-cyan: #06b6d4;
      --electric-cyan-glow: rgba(6, 182, 212, 0.25);
      
      --alert-crimson: #ef4444;
      --alert-glow: rgba(239, 68, 68, 0.25);
      --success-emerald: #10b981;
      --success-glow: rgba(16, 185, 129, 0.25);
      
      --grid-line: rgba(255, 255, 255, 0.02);
      --nav-blur-bg: rgba(8, 11, 17, 0.85);
      --shadow-elevation: 0 20px 40px rgba(0, 0, 0, 0.6);
      --focus-outline: 2px solid var(--hazard-yellow);
    }

    /* Light Theme Variant */
    [data-theme="light"] {
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #f1f5f9;
      --bg-card-hover: #e2e8f0;
      --border-subtle: #cbd5e1;
      --border-active: #94a3b8;
      
      --text-main: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      
      --hazard-yellow: #d97706;
      --hazard-yellow-hover: #b45309;
      --hazard-yellow-glow: rgba(217, 119, 6, 0.2);
      
      --electric-cyan: #0891b2;
      --electric-cyan-glow: rgba(8, 145, 178, 0.2);
      
      --grid-line: rgba(0, 0, 0, 0.03);
      --nav-blur-bg: rgba(255, 255, 255, 0.9);
      --shadow-elevation: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
      background-image: 
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .mono {
      font-family: var(--font-mono);
    }

    /* Accessibility focus styling */
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: var(--focus-outline);
      outline-offset: 3px;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Header & Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--nav-blur-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .brand-logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--bg-card), var(--bg-surface));
      border: 1px solid var(--hazard-yellow);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px var(--hazard-yellow-glow);
    }

    .brand-logo-icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--hazard-yellow);
    }

    .brand-tag {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--hazard-yellow);
      background: var(--hazard-yellow-glow);
      border: 1px solid var(--hazard-yellow);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Navigation Links */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      list-style: none;
    }

    .nav-link-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-link-btn:hover {
      color: var(--text-main);
      background: var(--bg-card);
    }

    .nav-link-btn.active {
      color: var(--text-main);
      background: var(--bg-card);
      border-color: var(--border-active);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .nav-link-btn.active .nav-dot {
      background: var(--hazard-yellow);
      box-shadow: 0 0 8px var(--hazard-yellow);
    }

    .nav-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: transparent;
      transition: background 0.2s ease;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Theme Toggle Button */
    .theme-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      border-color: var(--border-active);
      color: var(--hazard-yellow);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      font-family: var(--font-sans);
    }

    .btn-primary {
      background: var(--hazard-yellow);
      color: #000;
      box-shadow: 0 0 16px var(--hazard-yellow-glow);
    }

    .btn-primary:hover {
      background: var(--hazard-yellow-hover);
      transform: translateY(-1px);
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.4);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border-subtle);
      color: var(--text-main);
    }

    .btn-outline:hover {
      border-color: var(--border-active);
      background: var(--bg-card);
    }

    /* Live Telemetry Ticker */
    .telemetry-ticker {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 8px 0;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .ticker-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .status-pulse {
      width: 8px;
      height: 8px;
      background: var(--success-emerald);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success-emerald);
      animation: pulse-ring 2s infinite;
      display: inline-block;
      margin-right: 6px;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    /* Main Container Views */
    .view-content {
      padding: 48px 0 80px;
      min-height: calc(100vh - 240px);
    }

    /* Hero Section */
    .hero-section {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 48px;
      align-items: center;
      margin-bottom: 72px;
    }

    @media (max-width: 960px) {
      .hero-section {
        grid-template-columns: 1fr;
      }
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 100px;
      background: var(--hazard-yellow-glow);
      border: 1px solid var(--hazard-yellow);
      color: var(--hazard-yellow);
      font-size: 0.825rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .hero-title {
      font-size: clamp(2.4rem, 4.5vw, 3.8rem);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
    }

    .hero-title span.highlight {
      background: linear-gradient(135deg, var(--hazard-yellow), #fde047);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: 1.125rem;
      color: var(--text-secondary);
      margin-bottom: 32px;
      font-weight: 400;
      max-width: 640px;
    }

    .hero-cta-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Animated Robot Stage & Canvas */
    .robot-stage {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-elevation);
    }

    .stage-hud {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Quadruped SVG Animation Styles */
    .quadruped-svg {
      width: 100%;
      height: 320px;
      display: block;
      overflow: visible;
    }

    /* Gait cycle animations */
    @keyframes bodyBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(3px) rotate(-0.5deg); }
      50% { transform: translateY(-2px) rotate(0.5deg); }
      75% { transform: translateY(3px) rotate(-0.5deg); }
    }

    @keyframes legPairA-Thigh {
      0% { transform: rotate(-18deg); }
      25% { transform: rotate(14deg); }
      50% { transform: rotate(26deg); }
      75% { transform: rotate(-5deg); }
      100% { transform: rotate(-18deg); }
    }

    @keyframes legPairA-Shank {
      0% { transform: rotate(22deg); }
      25% { transform: rotate(-28deg); }
      50% { transform: rotate(-45deg); }
      75% { transform: rotate(-10deg); }
      100% { transform: rotate(22deg); }
    }

    @keyframes legPairB-Thigh {
      0% { transform: rotate(26deg); }
      25% { transform: rotate(-5deg); }
      50% { transform: rotate(-18deg); }
      75% { transform: rotate(14deg); }
      100% { transform: rotate(26deg); }
    }

    @keyframes legPairB-Shank {
      0% { transform: rotate(-45deg); }
      25% { transform: rotate(-10deg); }
      50% { transform: rotate(22deg); }
      75% { transform: rotate(-28deg); }
      100% { transform: rotate(-45deg); }
    }

    @keyframes lidarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes scanConeSweep {
      0%, 100% { transform: rotate(-12deg); opacity: 0.4; }
      50% { transform: rotate(18deg); opacity: 0.85; }
    }

    @keyframes groundDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -48; }
    }

    @keyframes antennaWhip {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(3deg); }
    }

    .anim-body {
      animation: bodyBob 1.2s ease-in-out infinite;
      transform-origin: 200px 150px;
    }

    .anim-leg-pair-a-thigh {
      animation: legPairA-Thigh 1.2s ease-in-out infinite;
    }
    .anim-leg-pair-a-shank {
      animation: legPairA-Shank 1.2s ease-in-out infinite;
    }

    .anim-leg-pair-b-thigh {
      animation: legPairB-Thigh 1.2s ease-in-out infinite;
    }
    .anim-leg-pair-b-shank {
      animation: legPairB-Shank 1.2s ease-in-out infinite;
    }

    .anim-lidar-spin {
      animation: lidarSpin 2s linear infinite;
      transform-origin: 240px 85px;
    }

    .anim-scan-cone {
      animation: scanConeSweep 2.4s ease-in-out infinite;
      transform-origin: 320px 105px;
    }

    .anim-ground {
      stroke-dasharray: 12 12;
      animation: groundDash 1.2s linear infinite;
    }

    .anim-antenna {
      animation: antennaWhip 1.2s ease-in-out infinite;
      transform-origin: 125px 95px;
    }

    /* Manifesto Box */
    .manifesto-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 36px;
      margin-bottom: 60px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
      align-items: center;
    }

    @media (max-width: 800px) {
      .manifesto-box {
        grid-template-columns: 1fr;
      }
    }

    /* Card Grids */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    @media (max-width: 900px) {
      .grid-3 {
        grid-template-columns: 1fr;
      }
    }

    .feature-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 28px;
      transition: all 0.2s ease;
    }

    .feature-card:hover {
      border-color: var(--border-active);
      transform: translateY(-2px);
      box-shadow: var(--shadow-elevation);
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      color: var(--hazard-yellow);
    }

    /* Inspector Console Styles */
    .console-wrapper {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-elevation);
    }

    .console-header {
      background: var(--bg-card);
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .console-body {
      display: grid;
      grid-template-columns: 1fr 340px;
      min-height: 520px;
    }

    @media (max-width: 990px) {
      .console-body {
        grid-template-columns: 1fr;
      }
    }

    .viewport-canvas {
      position: relative;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .viewport-sidebar {
      background: var(--bg-card);
      border-left: 1px solid var(--border-subtle);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Pipeline Animated Cards */
    .pipeline-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      position: relative;
      margin-top: 40px;
    }

    @media (max-width: 960px) {
      .pipeline-grid {
        grid-template-columns: 1fr;
      }
    }

    .pipeline-node {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 24px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .pipeline-node.active-stage {
      border-color: var(--hazard-yellow);
      box-shadow: 0 0 20px var(--hazard-yellow-glow);
    }

    .pipeline-number {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--hazard-yellow);
      margin-bottom: 12px;
    }

    /* Radar Ping Animation */
    .radar-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--electric-cyan);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .radar-sweep-arm {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(6, 182, 212, 0.4) 0deg, transparent 60deg, transparent 360deg);
      animation: lidarSpin 3s linear infinite;
    }

    /* Form Styles */
    .form-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 40px;
      max-width: 680px;
      margin: 0 auto;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--hazard-yellow);
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border-subtle);
      padding: 40px 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      background: var(--bg-surface);
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
  </style>

  <!-- React 18 & ReactDOM 18 loaded safely from reliable CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root">
    <!-- Fallback while React loads -->
    <div style="padding: 40px; text-align: center; color: #f59e0b; font-family: sans-serif;">
      <h2>Loading Unexpected Dynamics Platform...</h2>
    </div>
  </div>

  <script>
    // Pure React calls without Babel for safety & zero compilation dependencies
    (function () {
      if (!window.React || !window.ReactDOM) {
        console.error("React script failed to load. Please check internet connection.");
        return;
      }

      const e = React.createElement;
      const useState = React.useState;
      const useEffect = React.useEffect;
      const useMemo = React.useMemo;

      // Master Application Component
      function App() {
        // Routing state: 'home', 'inspector', 'dyn', 'pipeline', 'raas'
        const [currentRoute, setCurrentRoute] = useState(function() {
          const hash = window.location.hash.replace('#', '');
          return ['home', 'inspector', 'dyn', 'pipeline', 'raas'].includes(hash) ? hash : 'home';
        });

        // Theme state: 'dark' | 'light'
        const [theme, setTheme] = useState('dark');

        // Sync route changes
        useEffect(function() {
          function handleHashChange() {
            const hash = window.location.hash.replace('#', '');
            if (['home', 'inspector', 'dyn', 'pipeline', 'raas'].includes(hash)) {
              setCurrentRoute(hash);
            }
          }
          window.addEventListener('hashchange', handleHashChange);
          return function() {
            window.removeEventListener('hashchange', handleHashChange);
          };
        }, []);

        // Sync theme changes
        useEffect(function() {
          document.documentElement.setAttribute('data-theme', theme);
        }, [theme]);

        function navigate(route) {
          window.location.hash = route;
          setCurrentRoute(route);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleTheme() {
          setTheme(function(prev) { return prev === 'dark' ? 'light' : 'dark'; });
        }

        return e('div', { className: 'app-root' },
          // Telemetry Ticker
          e('div', { className: 'telemetry-ticker mono' },
            e('div', { className: 'container ticker-inner' },
              e('div', null,
                e('span', { className: 'status-pulse' }),
                e('strong', null, 'VAJRA-01 FIELD STATUS: '),
                '400KV SWITCHYARD BAY 04 ROUTINE // ALL JOINTS NOMINAL'
              ),
              e('div', null,
                'FARADAY EMF SHIELD: ',
                e('span', { style: { color: 'var(--success-emerald)', fontWeight: 700 } }, '765KV CERTIFIED'),
                ' | BATTERY: ',
                e('strong', null, '88% (AUTODOCK ENGAGED)')
              )
            )
          ),

          // Header Navigation
          e('header', null,
            e('div', { className: 'container nav-inner' },
              // Logo
              e('a', {
                href: '#home',
                onClick: function(ev) { ev.preventDefault(); navigate('home'); },
                className: 'brand-logo'
              },
                e('div', { className: 'brand-logo-icon' },
                  e('svg', { viewBox: '0 0 24 24', fill: 'none', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },
                    e('rect', { x: 4, y: 4, width: 16, height: 16, rx: 3 }),
                    e('path', { d: 'M9 9h6v6H9z' }),
                    e('path', { d: 'M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3' })
                  )
                ),
                'Unexpected Dynamics',
                e('span', { className: 'brand-tag' }, 'Deep Tech India')
              ),
